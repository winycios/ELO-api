spring.application.name=elo-api
spring.config.import=optional:file:.env[.properties]

#Porta padrão para acesso a API
server.servlet.context-path=/api
server.port=8090

# Health check publico em GET /api/actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
#Não permitir subir assim em PRD
management.endpoint.health.show-details=always


# URL de conexão com o MySQL
# application.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true


# Redis (armazenamento das sessões de refresh token por dispositivo)
# Obs.: a expiração por field do hash (HEXPIRE) exige Redis 7.4+
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

security.jwt.secret-key=${JWT_SECRET_KEY:}

# Access token: 1 hora (ms)
security.jwt.access-token.expiration=3600000
# Refresh token / cookie: 7 dias (ms)
security.jwt.refresh-token.expiration=604800000

# Consulta de latitude e longitude pelo CEP
integration.awesome-api-cep.url=https://cep.awesomeapi.com.br/json

# Elasticsearch - indice de busca de profissionais
elo.search.enabled=${ELASTICSEARCH_ENABLED:true}
elo.search.url=${ELASTICSEARCH_URL:http://localhost:9200}
elo.search.username=${ELASTICSEARCH_USERNAME:}
elo.search.password=${ELASTICSEARCH_PASSWORD:}
elo.search.index-name=${ELASTICSEARCH_INDEX_NAME:profissionais_search_v1}

# Worker da outbox: 5 minutos por padrao
elo.search.outbox.fixed-delay-ms=${ELASTICSEARCH_OUTBOX_DELAY_MS:300000}
elo.search.outbox.initial-delay-ms=${ELASTICSEARCH_OUTBOX_INITIAL_DELAY_MS:300000}
elo.search.outbox.max-attempts=${ELASTICSEARCH_OUTBOX_MAX_ATTEMPTS:10}
elo.search.initial-reindex-enabled=${ELASTICSEARCH_INITIAL_REINDEX_ENABLED:true}

elo.notification.push.enabled=${NOTIFICATION_PUSH_ENABLED:false}
elo.notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}

# Firebase Admin SDK.
elo.notification.firebase.project-id=${FIREBASE_PROJECT_ID:}
elo.notification.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# SMTP
elo.notification.email.from=${NOTIFICATION_EMAIL_FROM:no-reply@elo.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# Storage de imagens (S3/MinIO).
elo.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
elo.storage.region=${STORAGE_REGION:us-east-1}
elo.storage.access-key=${STORAGE_ACCESS_KEY:elo-local}
elo.storage.secret-key=${STORAGE_SECRET_KEY:elo-local-secret}
elo.storage.path-style=${STORAGE_PATH_STYLE:true}
elo.storage.bucket-publico=${STORAGE_BUCKET_PUBLICO:elo-publico}
elo.storage.bucket-privado=${STORAGE_BUCKET_PRIVADO:elo-privado}
elo.storage.url-publica-base=${STORAGE_PUBLIC_BASE_URL:http://localhost:9000}
elo.storage.presigned-expiration-seconds=${STORAGE_PRESIGNED_EXPIRATION_SECONDS:3600}
elo.storage.tamanho-maximo-bytes=${STORAGE_MAX_FILE_SIZE_BYTES:5242880}

spring.servlet.multipart.max-file-size=${STORAGE_MAX_FILE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-request-size=${STORAGE_MAX_FILE_SIZE_BYTES:5242880}

elo.notification.outbox.fixed-delay-ms=${NOTIFICATION_OUTBOX_DELAY_MS:3000}
elo.notification.outbox.initial-delay-ms=${NOTIFICATION_OUTBOX_INITIAL_DELAY_MS:5000}
elo.notification.outbox.max-attempts=${NOTIFICATION_OUTBOX_MAX_ATTEMPTS:10}
elo.notification.outbox.processing-timeout-seconds=${NOTIFICATION_PROCESSING_TIMEOUT_SECONDS:300}
elo.notification.outbox.retry-base-seconds=${NOTIFICATION_RETRY_BASE_SECONDS:5}
elo.notification.outbox.retry-max-seconds=${NOTIFICATION_RETRY_MAX_SECONDS:3600}